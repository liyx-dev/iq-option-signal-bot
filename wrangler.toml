name = "iq-option-signal-bot"
main = "src/index.js"
compatibility_date = "2024-09-25"

# Enable Cloudflare Workers AI
[ai]
binding = "AI"

# Bind Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "trading_db"
database_id = "0d926bab-27da-4f0c-b938-cf4547d30e3c"

# Scheduled Cron: Trigger every 5 minutes to generate new timed Blitz signals
[triggers]
crons = ["*/5 * * * *"]

